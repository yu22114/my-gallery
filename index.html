<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yu-gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>yu-gallery</h1>
  </header>

  <main>
    <ul class="gallery">
      <!-- ここに絵を追加する。コピペで増やせる。
      <li class="item">
        <img src="images/example.png" alt="作品タイトル">
        <div class="info">
          <span class="title">作品タイトル</span>
          <a class="dl" href="#" data-src="images/example.png" data-filename="example.png">Download</a>
        </div>
      </li>
      -->
      <li class="item">
        <img src="images/IMG_0526.jpeg" alt="コダック">

          <span class="title">コダック</span>
          <a class="dl" href="#" data-src="images/IMG_0526.jpeg" data-filename="コダック.jpeg">Download</a>
        </div>
      </li>
    </ul>

    <p class="empty">作品はまだありません。</p>
  </main>

  <script src="main.js"></script>

</html>
